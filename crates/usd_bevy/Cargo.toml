[package]
name = "usd_bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Bevy plugin: live OpenUSD stage projection, routing, authoring, and marker components."
repository = "https://github.com/bresilla/bevy_openusd"

[dependencies]
openusd = { workspace = true }
usd_model = { workspace = true }
usd_macro = { workspace = true }
usd_rapier = { workspace = true }
rapier3d-f64 = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
image = { workspace = true, features = ["png", "jpeg"] }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "morph",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "ktx2",
    "zstd_rust",
    "reflect_auto_register",
] }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
serde_json = { workspace = true }
