[package]
name = "usd_support"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shared OpenUSD test support: fixtures, temporary USDA generation, and stage builders"

[lib]
path = "lib.rs"

[dependencies]
openusd = { workspace = true }
openusd-schemas = { workspace = true, features = [
    "geom",
    "shade",
    "skel",
    "lux",
    "physics",
    "media",
    "vol",
    "render",
    "proc",
    "ui",
] }
tempfile = { workspace = true }
anyhow = { workspace = true }
