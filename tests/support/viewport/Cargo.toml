[package]
name = "viewport_support"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shared Bevy Viewport test support: proven app builders and entity queries"

[lib]
path = "lib.rs"

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_scene",
    "bevy_gizmos",
] }
usd_bevy = { workspace = true }
openusd = { workspace = true }
openusd-schemas = { workspace = true, features = [
    "geom",
    "shade",
    "skel",
    "lux",
    "physics",
    "media",
    "vol",
    "render",
    "proc",
    "ui",
] }
