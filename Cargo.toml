[workspace]
resolver = "2"
members = [
    "crates/usd_schema",
    "crates/usd_rapier",
    "crates/usd_bevy",
    "crates/viewport_protocol",
    "crates/viewport_streaming",
]
exclude = ["xtra"]

[workspace.dependencies]
# Keep every USD layer on one exact upstream revision. Updating this single
# entry updates usd_schema, usd_rapier, and usd_bevy together.
openusd = { git = "https://github.com/mxpv/openusd", rev = "8d605e31891fd4cfada1c068fbf6ac2a17c704aa" }
usd_schema = { path = "crates/usd_schema" }
usd_rapier = { path = "crates/usd_rapier" }
usd_bevy = { path = "crates/usd_bevy" }
viewport_protocol = { path = "crates/viewport_protocol" }
viewport_streaming = { path = "crates/viewport_streaming" }

bevy = { version = "0.19", default-features = false }
rapier3d-f64 = "0.34"
glam = "0.32"
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false }
image = { version = "0.25", default-features = false }

[package]
name = "usdview"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Interactive viewer for OpenUSD scenes — built on bevy + the usd_bevy plugin."
repository = "https://github.com/bresilla/bevy_openusd"
build = "build.rs"

[[bin]]
name = "usdview"
path = "src/main.rs"

[dependencies]
# The Bevy USD plugin: asset loader, scene projection, marker
# components, Rapier physics adapter. Single dep brings in everything
# needed to load a USD into a Bevy app.
usd_bevy = { workspace = true }
# Pure-Rust USD readers/writers — the viewer reads camera projection
# and anim track data directly off the loaded `Stage` without going
# through Bevy components.
usd_schema = { workspace = true }
# Direct Rapier dep for the viewer's static-ground collider authoring;
# `usd_bevy::physics::PhysicsWorld` exposes the Rapier sets we mutate.
rapier3d-f64 = { workspace = true }
viewport_protocol = { workspace = true }
serde_json = { workspace = true }
viewport_streaming = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "morph",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "ktx2",
    "zstd_rust",
    "x11",
    "wayland",
    "reflect_auto_register",
] }

anyhow = { workspace = true }
# Native file-picker dialog for the "Browse USD…" button.
rfd = "0.17.2"
# VS-Code-style egui chrome.
bevy_egui = { version = "0.41", default-features = false, features = [
    "default_fonts",
    "render",
] }
# Glass-themed editor UI kit (ribbons, floating panels, widgets, tokens).
bevy_frost = { path = "../bevy_frost/crates/bevy_frost" }
# Reusable 3D-scene gizmos (axis triads + joint primitives).
bevy_glacial = { path = "../bevy_glacial" }

# `build.rs` bakes a sample USDZ (USDA + procedural PNG) into
# `assets/external/` so `cargo run -- usdz_sample.usdz` always has
# something real to show.
[build-dependencies]
zip = { workspace = true, features = ["deflate"] }
image = { workspace = true, features = ["png"] }

[dev-dependencies]
openusd = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
image = { workspace = true, features = ["png"] }
