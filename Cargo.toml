[workspace]
resolver = "2"
members = [
    "crates/usd_macro",
    "crates/usd_rapier",
    "crates/usd_bevy",
    "crates/usd_model",
    "crates/usd_semantic",
    "crates/usd_diff",
    "crates/usd_git",
    "crates/viewport_protocol",
    "crates/viewport_streaming",
]
exclude = ["xtra"]


[workspace.dependencies]
# Keep every USD layer on one exact upstream revision. Updating this single
# entry updates usd_macro, usd_rapier, and usd_bevy together.
openusd = { git = "https://github.com/mxpv/openusd", rev = "8d605e31891fd4cfada1c068fbf6ac2a17c704aa", features = [
    "geom",
    "shade",
    "skel",
    "lux",
    "physics",
    "media",
    "vol",
    "render",
    "proc",
    "ui",
] }
usd_macro = { path = "crates/usd_macro" }
usd_rapier = { path = "crates/usd_rapier" }
usd_bevy = { path = "crates/usd_bevy" }
usd_model = { path = "crates/usd_model" }
usd_semantic = { path = "crates/usd_semantic" }
usd_diff = { path = "crates/usd_diff" }
usd_git = { path = "crates/usd_git" }
viewport_protocol = { path = "crates/viewport_protocol" }
viewport_streaming = { path = "crates/viewport_streaming" }
turso = { version = "0.7.1", default-features = false, features = ["sync"] }

proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.3", features = ["full"] }
bitflags = "2"
blake3 = "1.8.5"

bevy = { version = "0.19", default-features = false }
rapier3d-f64 = "0.34"
glam = "0.32"
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false }
image = { version = "0.25", default-features = false }

[package]
name = "usdview"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Interactive viewer for OpenUSD scenes — built on bevy + the usd_bevy plugin."
repository = "https://github.com/bresilla/bevy_openusd"
build = "build.rs"
default-run = "usdview"
autotests = false
autoexamples = false

[[bin]]
name = "usdview"
path = "src/main.rs"

[[test]]
name = "live_projection"
path = "tests/live_projection.rs"

[[test]]
name = "rapier_bridge"
path = "tests/rapier_bridge.rs"

[[test]]
name = "cache_profile"
path = "tests/cache_profile.rs"

[[test]]
name = "git_materialization"
path = "tests/git_materialization.rs"

[[example]]
name = "pack_usdz"
path = "examples/pack_usdz.rs"

[dependencies]
# Current live USD projection and marker routes.
usd_bevy = { workspace = true }
usd_model = { workspace = true }
usd_semantic = { workspace = true }
usd_diff = { workspace = true }
usd_git = { workspace = true }
# Pure USD-physics → Rapier builders used by the viewport-owned adapter.
usd_rapier = { workspace = true }
openusd = { workspace = true }
# Direct Rapier dep for the viewport-owned f64 simulation state.
rapier3d-f64 = { workspace = true }
viewport_protocol = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
viewport_streaming = { workspace = true }
turso = { workspace = true }
blake3 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
tempfile = "3"
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_scene",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_post_process",
    "morph",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "png",
    "jpeg",
    "bmp",
    "tga",
    "hdr",
    "webp",
    "tiff",
    "ktx2",
    "zstd_rust",
    "x11",
    "wayland",
    "reflect_auto_register",
] }
log = { workspace = true }
anyhow = { workspace = true }
# Native file-picker dialog for the "Browse USD…" button.
rfd = "0.17.2"
# VS-Code-style egui chrome.
bevy_egui = { version = "0.41", default-features = false, features = [
    "default_fonts",
    "render",
] }
# Glass-themed editor UI kit (ribbons, floating panels, widgets, tokens).
bevy_frost = { path = "../bevy_frost/crates/bevy_frost" }
# Reusable 3D-scene gizmos (axis triads + joint primitives).
bevy_glacial = { path = "../bevy_glacial" }

# `build.rs` bakes a sample USDZ (USDA + procedural PNG) into
# `assets/external/` so `cargo run -- usdz_sample.usdz` always has
# something real to show.
[build-dependencies]
zip = { workspace = true, features = ["deflate"] }
image = { workspace = true, features = ["png"] }

[dev-dependencies]
openusd = { workspace = true }
usd_git = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
image = { workspace = true, features = ["png"] }
